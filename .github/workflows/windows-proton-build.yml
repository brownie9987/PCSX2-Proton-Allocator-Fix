name: PCSX2 v2.9.53 Proton Allocator Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout official PCSX2 v2.9.53
        shell: pwsh
        run: |
          git clone --branch v2.9.53 --depth 1 --recurse-submodules https://github.com/PCSX2/pcsx2.git pcsx2

      - name: Create short build path
        shell: cmd
        run: |
          subst P: "%GITHUB_WORKSPACE%\pcsx2"
          dir P:\
          cd pcsx2
          git submodule update --init --recursive

      - name: Apply Proton allocator fix
        shell: pwsh
        run: |
          $path = "pcsx2/common/AlignedMalloc.h"
          $text = [System.IO.File]::ReadAllText($path)

          $old = @'
          #else
          #define pcsx2_aligned_realloc(handle, new_size, align, old_size) \
          	_aligned_realloc(handle, new_size, align)
          #endif
          '@

          $new = @'
          #else
          static inline void* pcsx2_aligned_realloc(void* handle, size_t new_size, size_t align, size_t old_size)
          {
          	void* newbuf = _aligned_malloc(new_size, align);
          	if (newbuf != NULL && handle != NULL)
          	{
          		memcpy(newbuf, handle, std::min(old_size, new_size));
          		_aligned_free(handle);
          	}
          	return newbuf;
          }
          #endif
          '@

          if (-not $text.Contains($old)) {
            throw "Expected v2.9.53 allocator block not found"
          }

          $text = $text.Replace($old, $new)

          if (-not $text.Contains("#include <algorithm>")) {
            $text = $text.Replace(
              "#pragma once",
              "#pragma once`r`n`r`n#include <algorithm>`r`n#include <cstring>"
            )
          }

          [System.IO.File]::WriteAllText($path, $text)

          Write-Host "Allocator patch applied."

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build PCSX2 Windows Dependencies
        shell: cmd
        working-directory: P:\\
        run: |
          call .github\workflows\scripts\windows\build-dependencies.bat deps
          if errorlevel 1 exit /b %errorlevel%

      - name: Configure
        shell: cmd
        working-directory: P:\\
        run: |
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DPACKAGE_MODE=ON ^
            "-DCMAKE_PREFIX_PATH=%cd%\deps"
          if errorlevel 1 exit /b %errorlevel%

      - name: Build
        shell: cmd
        working-directory: P:\\
        run: |
          cmake --build build --config Release
          if errorlevel 1 exit /b %errorlevel%

      - name: Collect complete PCSX2 package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path P:\build -Recurse -Filter pcsx2-qt.exe |
            Select-Object -First 1

          if (-not $exe) {
            throw "pcsx2-qt.exe was not produced"
          }

          $package = $exe.Directory.FullName

          Write-Host "PCSX2 package directory:"
          Write-Host $package
          Get-ChildItem $package | Select-Object Name, Length

          if (-not (Test-Path (Join-Path $package "resources"))) {
            throw "Matching resources directory was not produced beside pcsx2-qt.exe"
          }

          New-Item -ItemType Directory -Force C:\artifact | Out-Null
          Copy-Item "$package\*" C:\artifact\ -Recurse -Force

          Write-Host "Collected package:"
          Get-ChildItem C:\artifact | Select-Object Name, Length

          Write-Host "Patched executable hash:"
          Get-FileHash C:\artifact\pcsx2-qt.exe -Algorithm SHA256

      - name: Upload patched executable
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2-v2.9.53-Proton-Allocator-Fix-Full
          path: C:\\artifact
          if-no-files-found: error
